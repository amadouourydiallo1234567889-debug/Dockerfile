<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👑 Dicta MD 👑</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=UnifrakturCook:wght@700&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --blood: #b3111f;
    --blood-bright: #ff2d3d;
    --ember: #ff7a1a;
    --void: #060403;
    --ash: #1a1210;
    --gold: #c9a24b;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    background: var(--void);
    color: #eae2d8;
    padding: 20px;
    overflow: hidden;
    position: relative;
}

/* Fond démoniaque : brume rouge + veines de lumière */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse 60% 45% at 50% 105%, rgba(179, 17, 31, 0.35) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 15% 15%, rgba(120, 10, 20, 0.18) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 85% 10%, rgba(90, 20, 10, 0.15) 0%, transparent 70%),
        var(--void);
    z-index: 0;
}

/* Texture de fissures / grain subtil */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image: repeating-linear-gradient(115deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
    z-index: 0;
    pointer-events: none;
}

canvas#embers {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
}

/* Card */
.card {
    position: relative;
    z-index: 2;
    width: 90%;
    max-width: 420px;
    background: linear-gradient(180deg, rgba(20, 10, 8, 0.92), rgba(6, 4, 3, 0.96));
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 22px;
    padding: 36px 26px 28px;
    text-align: center;
    border: 1px solid rgba(179, 17, 31, 0.35);
    box-shadow:
        0 0 0 1px rgba(0,0,0,0.4),
        0 30px 90px rgba(0, 0, 0, 0.85),
        0 0 60px rgba(179, 17, 31, 0.12),
        inset 0 1px 0 rgba(255, 122, 26, 0.06);
}

.sigil {
    font-size: 1.6rem;
    margin-bottom: 6px;
    opacity: 0.85;
    filter: drop-shadow(0 0 8px rgba(255, 45, 61, 0.5));
}

/* Titre gothique lueur pulsante */
@keyframes emberGlow {
    0%, 100% { text-shadow: 0 0 12px rgba(255, 45, 61, 0.55), 0 0 30px rgba(179, 17, 31, 0.35); }
    50% { text-shadow: 0 0 22px rgba(255, 122, 26, 0.75), 0 0 46px rgba(179, 17, 31, 0.55); }
}

h1.main-title {
    font-family: 'UnifrakturCook', cursive;
    font-size: 2.6rem;
    color: var(--blood-bright);
    letter-spacing: 1px;
    animation: emberGlow 3.5s ease-in-out infinite;
    margin-bottom: 2px;
}

h2.sub-title {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 6px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 4px;
}

.status {
    font-family: 'Cinzel', serif;
    font-size: 0.68rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.65;
    margin: 8px 0 22px 0;
    color: #cbb89a;
}

.divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 4px 0 18px 0;
    opacity: 0.5;
}
.divider span { width: 36px; height: 1px; background: linear-gradient(90deg, transparent, var(--blood), transparent); }
.divider i { color: var(--blood-bright); font-size: 0.6rem; }

/* Input rituel */
.input-box {
    padding: 2px;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(179,17,31,0.5), rgba(255,122,26,0.25), rgba(179,17,31,0.5));
    margin-bottom: 16px;
}

input {
    width: 100%;
    border: none;
    outline: none;
    padding: 16px;
    border-radius: 14px;
    background: #0d0906;
    color: #f2e9dc;
    text-align: center;
    font-size: 1.02rem;
    font-family: 'Poppins', sans-serif;
    letter-spacing: 1px;
}

input::placeholder { color: #5a4a40; }

input:focus { box-shadow: inset 0 0 20px rgba(255, 45, 61, 0.15); }

/* Bouton "Mets toi à l'aise" */
@keyframes pulseBtn {
    0%, 100% { box-shadow: 0 0 20px rgba(179, 17, 31, 0.3); }
    50% { box-shadow: 0 0 34px rgba(255, 122, 26, 0.4); }
}

button.ritual-btn {
    width: 100%;
    border: 1px solid rgba(255, 122, 26, 0.4);
    border-radius: 16px;
    padding: 17px;
    font-family: 'Cinzel', serif;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    color: #f2e9dc;
    background: linear-gradient(135deg, rgba(179, 17, 31, 0.55), rgba(60, 10, 10, 0.65));
    animation: pulseBtn 2.8s ease-in-out infinite;
    transition: all 0.3s;
}

button.ritual-btn:hover {
    background: linear-gradient(135deg, rgba(255, 45, 61, 0.7), rgba(90, 15, 15, 0.75));
    transform: translateY(-2px);
    border-color: rgba(255, 122, 26, 0.7);
}

button.ritual-btn:active { transform: translateY(0px); }

/* Résultat */
.result-box {
    width: 100%;
    margin: 18px auto 0;
    padding: 2px;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(179,17,31,0.5), rgba(255,122,26,0.3), rgba(179,17,31,0.5));
    display: none;
}

.result-inner {
    background: #0d0906;
    border-radius: 14px;
    padding: 18px;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', serif;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 3px;
}

/* Footer */
.badge-group {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 20px;
}

.badge {
    padding: 5px 14px;
    border-radius: 30px;
    background: rgba(179, 17, 31, 0.08);
    border: 1px solid rgba(179, 17, 31, 0.25);
    font-size: 0.6rem;
    letter-spacing: 1px;
    color: #b89a80;
    font-weight: 500;
    font-family: 'Cinzel', serif;
}

footer.made-by {
    margin-top: 14px;
    font-size: 0.6rem;
    letter-spacing: 1px;
    color: #5a4a40;
    font-family: 'Cinzel', serif;
}

@media (max-width: 480px) {
    .card { padding: 28px 18px; }
    h1.main-title { font-size: 2.1rem; }
}
</style>
</head>
<body>

<canvas id="embers"></canvas>

<div class="card">

    <div class="sigil">⛧</div>
    <h1 class="main-title">Dicta MD</h1>
    <h2 class="sub-title">Pair Code</h2>

    <div class="divider"><span></span><i>✦</i><span></span></div>

    <p class="status">Invoque ton numéro WhatsApp</p>

    <div class="input-box">
        <input type="text" id="number" placeholder="224xxxxxxxxx">
    </div>

    <button class="ritual-btn" onclick="getCode()">Mets toi à l'aise</button>

    <div class="result-box" id="borderBox">
        <div class="result-inner" id="codeBox">----</div>
    </div>

    <div class="badge-group">
        <span class="badge">🤖 WhatsApp Bot</span>
        <span class="badge">🩸 Dicta MD</span>
        <span class="badge">✦ 2026</span>
    </div>

    <footer class="made-by">Made by Dicta · Mr Dracula Dev</footer>

</div>

<script>
// Particules de braises qui montent
const canvas = document.getElementById('embers');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

const particles = Array.from({ length: 45 }, () => spawn());
function spawn() {
    return {
        x: Math.random() * canvas.width,
        y: canvas.height + Math.random() * 100,
        r: Math.random() * 2 + 0.6,
        speed: Math.random() * 0.8 + 0.3,
        drift: (Math.random() - 0.5) * 0.5,
        life: Math.random() * 1
    };
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const p of particles) {
        p.y -= p.speed;
        p.x += p.drift;
        p.life -= 0.0015;
        if (p.y < -10 || p.life <= 0) Object.assign(p, spawn(), { y: canvas.height + 10 });

        const alpha = Math.max(p.life, 0);
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
        grad.addColorStop(0, `rgba(255, 122, 26, ${alpha * 0.9})`);
        grad.addColorStop(1, 'rgba(179, 17, 31, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 4, 0, Math.PI * 2);
        ctx.fill();
    }
    requestAnimationFrame(animate);
}
animate();

// Fonctionnalité de pairing (inchangée)
async function getCode() {
    const num = document.getElementById("number").value.replace(/[^0-9]/g, '');
    const codeBox = document.getElementById("codeBox");
    const borderBox = document.getElementById("borderBox");

    if (!num) {
        borderBox.style.display = "block";
        codeBox.style.letterSpacing = "normal";
        codeBox.style.color = "#ff2d3d";
        codeBox.innerText = "ÉCRIS TON NUMÉRO WHATSAPP";
        return;
    }

    borderBox.style.display = "block";
    codeBox.style.letterSpacing = "normal";
    codeBox.style.color = "#ff7a1a";
    codeBox.innerText = "INVOCATION EN COURS...";

    try {
        const res = await fetch(`/code?number=${num}`);
        const data = await res.json();

        if (data.code) {
            codeBox.style.letterSpacing = "4px";
            codeBox.style.color = "#f2e9dc";
            codeBox.innerText = data.code;
        } else {
            codeBox.style.color = "#ff2d3d";
            codeBox.innerText = "SERVEUR SATURÉ";
        }
    } catch (e) {
        codeBox.style.color = "#ff2d3d";
        codeBox.innerText = "SERVEUR SATURÉ";
    }
}

document.getElementById("number").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        e.preventDefault();
        getCode();
    }
});
</script>

</body>
</html>
